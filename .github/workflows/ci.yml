name: Analyze and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash macos/scripts/fetch_singbox.sh
      - run: flutter build macos --release
      - run: test -x build/macos/Build/Products/Release/TunnelChain.app/Contents/Resources/sing-box || test -f build/macos/Build/Products/Release/TunnelChain.app/Contents/MacOS/TunnelChainHelper
